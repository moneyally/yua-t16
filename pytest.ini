# pytest.ini — ORBIT 테스트 설정
#
# marker 하나만 등록한다. 기본 실행(`python3 -m pytest tests/ -q`)은 **전부** 돌린다 —
# PLAN W4-2 의 완료 기준이 "d=64 N=1000 시드 3개 통과" 이므로 기본에서 빼지 않는다.
# 저녁 확인처럼 빨리 보고 싶을 때만 골라낸다:
#
#     python3 -m pytest tests/ -q -m "not slow"    # ~1초
#     python3 -m pytest tests/ -q                  # ~44초 (전체)
[pytest]
markers =
    slow: 수십 초 걸리는 테스트 (d=64 N=1000 골든-대-골든 등)
